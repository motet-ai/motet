<!DOCTYPE html>
<html>
<head>
    <title>Authentication Error</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 1rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #c53030;
            margin-top: 0;
        }
        p {
            color: #4a5568;
            margin: 1.5rem 0;
        }
        pre {
            background: #fed7d7;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: left;
            overflow-x: auto;
            font-size: 0.9rem;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Authentication Failed</h1>
        <p>{{ error_message }}</p>
        {% if error_details %}
        <pre>{{ error_details }}</pre>
        {% endif %}
    </div>
    <script>
        setTimeout(() => window.close(), {{ close_delay }});
    </script>
</body>
</html>
