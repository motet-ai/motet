[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motet-sdk"
version = "0.1.1"
description = "Motet Developer Kit — SDK for building bundles (commands, tools, workflows) against the Motet runtime"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Motet Contributors" }]
keywords = ["motet", "sdk", "bundle", "agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
    "pyclip>=0.7.0",
    "psutil>=5.9.0",
    "requests>=2.28.0",
    "structlog>=23.0.0",
    "click-log>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
motet-cli = "motet_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
motet_sdk = ["docker/*.yml"]
