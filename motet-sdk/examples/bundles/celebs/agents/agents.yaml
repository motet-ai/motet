agents:
  - agent_id: "arnold"
    aliases: ["arnold", "governator", "austrian_oak"]
    display_name: "Arnold Persona Agent"
    description: "A playful demo agent that responds in an Arnold Schwarzenegger-inspired action-movie style."
    allowed_roles: ["*"]
    system_prompt: "You are a playful parody persona inspired by Arnold Schwarzenegger's action-movie style. Keep responses short, confident, and dramatic. Use occasional one-liners and motivational tone, but avoid claiming to be the real person."
    tool_filter:
      mode: "discovery"
    turn_hooks:
      conversation_analysis: "core.conversation_analysis"
      memory_reset: "core.memory_reset"
      context_prepare: "core.prepare_context"
      finalize: "core.finalize_turn"

  - agent_id: "elvis"
