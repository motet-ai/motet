global
    daemon
    log stdout local0 info
    stats socket /var/run/haproxy.sock mode 600 level admin
    stats timeout 2m

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    timeout http-request 10s
    timeout http-keep-alive 2s
    timeout check 10s
    retries 3
    option redispatch
    option forwardfor
    option http-server-close

# Statistics interface
frontend stats
    bind *:8080
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# Load balanced worker access
frontend worker_frontend
    bind *:8090
    default_backend workers

# Worker backend pool
backend workers
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    # Reasoning workers
    server reasoning-1 reasoning-worker-1:8080 check inter 10s fall 3 rise 2
    server reasoning-2 reasoning-worker-2:8080 check inter 10s fall 3 rise 2
    
    # Tool workers  
    server tool-1 tool-worker-1:8080 check inter 10s fall 3 rise 2
    server tool-2 tool-worker-2:8080 check inter 10s fall 3 rise 2
    
    # Model workers
    server model-1 model-worker-1:8080 check inter 10s fall 3 rise 2
    
    # Memory workers
    server memory-1 memory-worker-1:8080 check inter 10s fall 3 rise 2
    
    # Planning workers
    server planning-1 planning-worker-1:8080 check inter 10s fall 3 rise 2

# Specific worker type backends for targeted routing
backend reasoning_workers
    balance roundrobin
    option httpchk GET /health
    server reasoning-1 reasoning-worker-1:8080 check
    server reasoning-2 reasoning-worker-2:8080 check

backend tool_workers
    balance roundrobin
    option httpchk GET /health
    server tool-1 tool-worker-1:8080 check
    server tool-2 tool-worker-2:8080 check

backend model_workers
    balance roundrobin
    option httpchk GET /health
    server model-1 model-worker-1:8080 check

backend memory_workers
    balance roundrobin
    option httpchk GET /health
    server memory-1 memory-worker-1:8080 check

backend planning_workers
    balance roundrobin
    option httpchk GET /health
    server planning-1 planning-worker-1:8080 check
