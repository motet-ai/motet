foreground = yes
pid =

[redis-tls]
client = no
accept = 0.0.0.0:6380
connect = redis:6379
cert = /tls/redis.crt
key = /tls/redis.key
CAfile = /tls/ca.crt
verify = 0
options = NO_SSLv2
options = NO_SSLv3
; Don't close idle connections: Celery workers hold long-lived broker connections;
; stunnel's default idle timeout can close them, causing Kombu _read_from_socket errors.
TIMEOUTidle = 86400
TIMEOUTclose = 0

